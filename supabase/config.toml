# Local Supabase stack. Install the CLI and Docker, then run `supabase start`.
project_id = "visaed-scholarships"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/invite",
  "http://localhost:3000/auth/reset",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/auth/confirm",
  "http://127.0.0.1:3000/auth/invite",
  "http://127.0.0.1:3000/auth/reset",
]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
